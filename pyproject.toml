[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "oncall-agent"
version = "0.1.0"
description = "A lightweight LangGraph and MCP workflow for structured incident diagnosis."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Zhanpeng Li" }]
dependencies = [
  "fastmcp>=3.4,<4.0",
  "langgraph>=1.2,<2.0",
  "pydantic>=2.11,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.1,<2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
oncall_agent = ["data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
